# configuration for https://release-plz.dev

[workspace]
# cliff.toml is the single source of truth for the changelog: release-plz drives
# git-cliff with it rather than keeping a second, divergent template.
changelog_config = "cliff.toml"

# Publish only when a release PR is merged, never on an ordinary push to main.
# The default reconciles the registry against the manifest on every run, which
# would publish any version bump the moment it lands.
release_always = false

# The GitHub release body is built from the release section alone, so the banner
# in cliff.toml's header never reaches it. Repeat it here, and strip the
# git-cliff marker, which belongs in the file rather than on the release page.
git_release_body = """
<img src="https://raw.githubusercontent.com/furkankly/rataflow/main/assets/rataflow.svg" width="300" />

[**rataflow**](https://rataflow.furkankly.dev): Interactive node-based UIs for the terminal.

{{ changelog | replace(from="<!-- generated by git-cliff -->", to="") | trim }}
"""
